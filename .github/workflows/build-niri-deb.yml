name: Build Niri 26.04 .deb on Debian Stable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root

    steps:
      - name: Checkout Niri source
        uses: actions/checkout@v4
        with:
          repository: niri-wm/niri
          ref: v26.04
          path: niri

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            gcc clang libudev-dev libgbm-dev libxkbcommon-dev \
            libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev \
            libsystemd-dev libseat-dev libpipewire-0.3-dev \
            libpango1.0-dev libdisplay-info-dev \
            git curl dpkg-dev

      - name: Install Rust toolchain and cargo-deb
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version
          cargo install cargo-deb

      - name: Build .deb package
        working-directory: ./niri
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          . "$HOME/.cargo/env"
          cargo deb --no-build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: niri-deb
          path: niri/target/debian/*.deb
          retention-days: 7
